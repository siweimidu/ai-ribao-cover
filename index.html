<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 日报封面工作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@400;700;900&family=Archivo+Black&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/cover.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230065fd'/%3E%3Ctext x='16' y='22' font-size='15' font-family='sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">AI</div>
      <div>
        <div class="brand-name">AI 日报封面工作室</div>
        <div class="brand-sub">COVER STUDIO · 11 STYLES</div>
      </div>
    </div>
    <div class="vsep"></div>
    <button class="btn icon" id="btnUndo" title="撤销 (Ctrl+Z)">↺</button>
    <button class="btn icon" id="btnRedo" title="重做 (Ctrl+Shift+Z)">↻</button>
    <div class="spacer"></div>
    <button class="btn" id="btnAi">✦ AI 一键生成</button>
    <button class="btn" id="btnImport">导入 JSON</button>
    <button class="btn" id="btnJson">保存 JSON</button>
    <button class="btn primary" id="btnPng">出图 PNG <span class="kbd">Ctrl+S</span></button>
    <input type="file" id="fileInput" accept=".json,application/json" class="hidden">
  </header>

  <aside class="panel left">
    <div class="tabs">
      <button class="tab on" data-tab="content">内容</button>
      <button class="tab" data-tab="style">风格</button>
      <button class="tab" data-tab="icons">图标</button>
    </div>
    <div class="pane on" id="paneContent"></div>
    <div class="pane" id="paneStyle"></div>
    <div class="pane" id="paneIcons"></div>
  </aside>

  <main class="stage-wrap">
    <div class="stage-bar">
      <span class="pill live"><i class="dot"></i> 实时编辑</span>
      <span class="pill" id="zoomLabel">100%</span>
      <select class="input" id="ratioSelect" title="画幅" style="width:auto;height:26px;font-size:11.5px;padding:0 6px"></select>
      <span class="pill" id="sizeLabel">1160 × 720</span>
      <div class="spacer"></div>
      <span style="opacity:.62;font-size:10.5px">拖图标进画布 · 双击文字改 · Ctrl+S 出图</span>
      <button class="btn sm" id="btnFit">适应窗口</button>
    </div>
    <div class="stage-scroll" id="stageScroll">
      <div class="stage-box" id="stageBox">
        <div id="cover"></div>
        <div class="sel-layer" id="selLayer"></div>
      </div>
    </div>
  </main>

  <aside class="panel right">
    <div class="tabs">
      <button class="tab on" data-tab="props">属性</button>
      <button class="tab" data-tab="layers">图层</button>
      <button class="tab" data-tab="shot">出图</button>
    </div>
    <div class="pane on" id="paneProps"></div>
    <div class="pane" id="paneLayers"></div>
    <div class="pane" id="paneShot">
      <div class="group">
        <div class="group-h"><span class="group-t">导出倍率</span></div>
        <div class="seg" id="scaleSeg">
          <button data-scale="1">1×</button>
          <button class="on" data-scale="2">2×</button>
          <button data-scale="3">3×</button>
        </div>
      </div>
      <div class="note">出图由本地 Playwright 在磁盘生成 PNG，路径固定为 <b>out/</b>，可直接拖进剪辑软件。</div>
    </div>
  </aside>
</div>

<div class="toasts" id="toasts"></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script src="assets/js/model.js"></script>
<script src="assets/js/ratios.js"></script>
<script src="assets/js/presets.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/panels.js"></script>
<script src="assets/js/studio.js"></script>
</body>
</html>
