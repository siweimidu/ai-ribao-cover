<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 日报封面工作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@400;700;900&family=Archivo+Black&display=swap">
<link rel="stylesheet" href="assets/css/app.css?v=f24">
<link rel="stylesheet" href="assets/css/cover.css?v=f24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2.6' y='2.6' width='17.4' height='17.4' rx='5' fill='%23c7d8ff'/%3E%3Crect x='10.2' y='10.2' width='18.8' height='18.8' rx='5.6' fill='%231f6bff'/%3E%3Crect x='13.6' y='14.6' width='9.6' height='2.3' rx='1.15' fill='white'/%3E%3Crect x='13.6' y='18.6' width='5.4' height='2.3' rx='1.15' fill='white' opacity='.62'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cvMark" x1="6" y1="4" x2="30" y2="30" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#5B93FF"/>
              <stop offset=".55" stop-color="#1F6BFF"/>
              <stop offset="1" stop-color="#0043AD"/>
            </linearGradient>
          </defs>
          <rect x="2.6" y="2.6" width="17.4" height="17.4" rx="5" fill="#C7D8FF" opacity=".72"/>
          <rect x="10.2" y="10.2" width="18.8" height="18.8" rx="5.6" fill="url(#cvMark)"/>
          <rect x="13.6" y="14.6" width="9.6" height="2.3" rx="1.15" fill="#fff" opacity=".96"/>
          <rect x="13.6" y="18.6" width="5.4" height="2.3" rx="1.15" fill="#fff" opacity=".62"/>
          <path d="M24.55 20.4l.86 2.44 2.44.86-2.44.86-.86 2.44-.86-2.44-2.44-.86 2.44-.86.86-2.44z" fill="#fff" opacity=".95"/>
        </svg>
      </div><div>
        <div class="brand-name">AI 日报封面工作室</div>
        <div class="brand-sub">COVER STUDIO · 16 STYLES</div>
      </div>
    </div>
    <button class="btn icon" id="btnTheme" title="深浅色切换">◐</button>
    <div class="vsep"></div>
    <button class="btn icon" id="btnUndo" title="撤销 (Ctrl+Z)">↺</button>
    <button class="btn icon" id="btnRedo" title="重做 (Ctrl+Shift+Z)">↻</button>
    <div class="spacer"></div>
    <button class="btn" id="btnAi">✦ AI 一键生成</button>
    <button class="btn" id="btnImg">插入图片</button>
    <button class="btn" id="btnImport">导入 JSON</button>
    <input type="file" id="imgInput" accept="image/*" class="hidden">
    <button class="btn" id="btnJson">保存 JSON</button>
    <button class="btn" id="btnHtml">导出 HTML</button>
    <button class="btn primary" id="btnPng">出图 PNG <span class="kbd">Ctrl+S</span></button>
    <input type="file" id="fileInput" accept=".json,application/json" class="hidden">
  </header>

  <aside class="panel left">
    <div class="tabs">
      <button class="tab on" data-tab="content">内容</button>
      <button class="tab" data-tab="style">风格</button>
      <button class="tab" data-tab="icons">图标</button>
      <button class="tab" data-tab="text">文字</button>
    </div>
    <div class="pane on" id="paneContent"></div>
    <div class="pane" id="paneStyle"></div>
    <div class="pane" id="paneIcons"></div>
    <div class="pane" id="paneText"></div>
  </aside>

  <main class="stage-wrap">
    <div class="stage-bar">
      <span class="pill live"><i class="dot"></i> 实时编辑</span>
      <span class="pill" id="zoomLabel">100%</span>
      <select class="input" id="ratioSelect" title="画幅" style="width:auto;height:26px;font-size:11.5px;padding:0 6px"></select>
      <span class="pill" id="sizeLabel">1160 × 720</span>
      <div class="spacer"></div>
      <span style="opacity:.62;font-size:10.5px">拖图标进画布 · 双击文字改 · Ctrl+S 出图</span>
      <button class="btn sm" id="btnFit">适应窗口</button>
    </div>
    <div class="stage-scroll" id="stageScroll">
      <div class="stage-box" id="stageBox">
        <div id="cover"></div>
        <div class="sel-layer" id="selLayer"></div>
      </div>
    </div>
  </main>

  <aside class="panel right">
    <div class="tabs">
      <button class="tab on" data-tab="props">属性</button>
      <button class="tab" data-tab="layers">图层</button>
      <button class="tab" data-tab="shot">出图</button>
      <button class="tab" data-tab="canvas">画布</button>
    </div>
    <div class="pane on" id="paneProps"></div>
    <div class="pane" id="paneLayers"></div>
    <div class="pane" id="paneCanvas"></div>
    <div class="pane" id="paneShot">
      <div class="group">
        <div class="group-h"><span class="group-t">导出倍率</span></div>
        <div class="seg" id="scaleSeg">
          <button data-scale="1">1×</button>
          <button class="on" data-scale="2">2×</button>
          <button data-scale="3">3×</button>
        </div>
      </div>
      <div class="note">出图由本地 Playwright 在磁盘生成 PNG，路径固定为 <b>out/</b>，可直接拖进剪辑软件。</div>
    </div>
  </aside>
</div>

<div class="toasts" id="toasts"></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script src="assets/js/model.js?v=f24"></script>
<script src="assets/js/ratios.js?v=f24"></script>
<script src="assets/js/presets.js?v=f24"></script>
<script src="assets/js/render.js?v=f24"></script>
<script src="assets/js/panels.js?v=f24"></script>
<script src="assets/js/studio.js?v=f24"></script>
</body>
</html>
