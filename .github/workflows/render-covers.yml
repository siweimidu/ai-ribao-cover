name: render-covers
on:
  push:
    paths:
      - 'content/**'
      - 'assets/js/presets.js'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install puppeteer
        run: npm init -y >/dev/null 2>&1 && npm i puppeteer@23 --no-audit --no-fund
      - name: Render batch
        run: node tools/render.mjs --batch content/example.json --scale 2
        env:
          COVER_NO_OPEN: '1'
      - name: Commit PNGs
        run: |
          git config user.name  "cover-render-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f out/*.png || true
          git commit -m "chore: render covers [skip ci]" || echo "nothing to commit"
          git push
